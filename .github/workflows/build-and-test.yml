# Builds the Studio and runs every test suite (python build.py --test) on Windows and macOS.
name: build-and-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      suites:
        description: "Only these test suites (comma-separated, e.g. ui_tests,motor); empty runs all"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            qt_arch: win64_msvc2022_64
          - name: macOS
            os: macos-latest
            qt_arch: clang_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      PYTHONUTF8: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.*"
          arch: ${{ matrix.qt_arch }}
          modules: qtcharts
          cache: true
          # Keep the Python set up above: the data layer's pinned numpy and scikit-learn need wheels.
          setup-python: false
      - name: CMake and Ninja
        run: python -m pip install --disable-pip-version-check cmake ninja
      - name: Build and run every test suite
        env:
          RAMAN_TEST_ONLY: ${{ github.event.inputs.suites }}
        run: python build.py --test
      - name: Keep the test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.name }}
          path: build/test-logs
          if-no-files-found: ignore
